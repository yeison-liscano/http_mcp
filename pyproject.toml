[project]
name = "http-mcp"
authors = [{ name = "Yeison Liscano" }]
maintainers = [{ name = "Yeison Liscano" }]
classifiers = [
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14"
]
keywords = ["mcp", "llm", "automation", "http"]
description = "This is a HTTP implementation of the MCP protocol"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
version = "0.16.0"

dependencies = ["pydantic (>=2.13.4,<3.0.0)", "uvicorn (>=0.52.4,<0.53.0)", "starlette>=1.6.0,<2.0.0"]

[project.optional-dependencies]
auth = []

[dependency-groups]
dev = [
    "jsonschema (>=4.26.0,<5.0.0)",
    "httpx2 (>=2.12.0,<3.0.0)",
    "mdformat (>=1.0.0,<2.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.16.3,<0.17.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
]

[tool.hatch.build.targets.wheel]
packages = ["src/http_mcp", "src/auth_mcp"]

[project.urls]
Homepage = "https://github.com/yeison-liscano/http_mcp"
Issues = "https://github.com/yeison-liscano/http_mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.uv.sources]
microsoft-python-type-stubs = { git = "https://github.com/microsoft/python-type-stubs.git" }
