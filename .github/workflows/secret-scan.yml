name: Secret Scan
on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "0 8 * * 1" # weekly full scan
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload SARIF to the Security tab
    steps:
      - name: Checkout repository
        uses: actions/checkout@c2d88d3ecc89a9ef08eebf45d9637801dcee7eb5
        with:
          # The scanner is a third-party binary run in the workspace; keep the
          # token out of .git/config.
          persist-credentials: false

      - name: Run secret scanner
        id: scan
        uses: fluidattacks/ss-action@42a2429824499567d409f2df58873eef39b87fbc # 0.4.0
        with:
          scan_config_path: fluidattacks_ss_config.yaml
          # Scan the whole tree, not only the files a push changed, so a
          # secret that is already committed keeps failing the build.
          scanner_mode: full

      - name: Upload SARIF to the Security tab
        if: ${{ !cancelled() && steps.scan.outputs.sarif_file != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ steps.scan.outputs.sarif_file }}
          category: fluidattacks-secrets

      # The action exits 0 when it finds secrets and only reports them through
      # this output, so the gate lives here.
      - name: Fail on secrets
        if: ${{ steps.scan.outputs.vulnerabilities_found == 'true' }}
        run: |
          echo "::error::Fluid Attacks found hardcoded secrets. See the scan log or the Security tab."
          exit 1
